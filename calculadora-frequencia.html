<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Frequência Alélica</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 2rem;
            max-width: 1000px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 0.5rem;
            font-size: 2.5rem;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }
        .input-section {
            background: #f8f9fa;
            padding: 2rem;
            border-radius: 10px;
            border: 2px solid #8b5cf6;
            margin-bottom: 2rem;
        }
        .input-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .input-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: bold;
            color: #333;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }
        .input-with-icon {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        input[type="number"] {
            flex: 1;
            padding: 0.75rem;
            font-size: 1rem;
            border: 2px solid #8b5cf6;
            border-radius: 6px;
            background: white;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: #ec4899;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }
        .genotype-badge {
            background: white;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            border: 2px solid #8b5cf6;
        }
        
        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
        }
        button {
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .calc-button {
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            color: white;
        }
        .calc-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3);
        }
        .reset-button {
            background: #6c757d;
            color: white;
        }
        .reset-button:hover {
            background: #5a6268;
            box-shadow: 0 10px 20px rgba(108, 117, 125, 0.3);
        }
        
        .result-section {
            display: none;
        }
        .result-section.show {
            display: block;
        }
        
        .frequency-display {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }
        .freq-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #f0f3f7 100%);
            padding: 2rem;
            border-radius: 10px;
            border-left: 4px solid #8b5cf6;
            text-align: center;
        }
        .freq-label {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 0.5rem;
        }
        .freq-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #8b5cf6;
            margin-bottom: 0.5rem;
        }
        .freq-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 1rem;
        }
        .freq-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #8b5cf6 0%, #ec4899 100%);
            width: 50%;
            transition: width 0.3s ease;
        }
        
        .table-section {
            margin-bottom: 2rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1rem;
        }
        th, td {
            padding: 0.75rem;
            text-align: center;
            border: 1px solid #ddd;
        }
        th {
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            color: white;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background: #f8f9fa;
        }
        tr:hover {
            background: #f0f3f7;
        }
        
        .visualization {
            background: linear-gradient(135deg, #f5f7fa 0%, #f0f3f7 100%);
            padding: 2rem;
            border-radius: 10px;
            margin-bottom: 2rem;
        }
        .vis-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }
        .allele-pool {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding: 1rem;
            background: white;
            border-radius: 8px;
        }
        .allele {
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-weight: bold;
            font-size: 0.9rem;
            color: white;
        }
        .allele-A { background: #3b82f6; }
        .allele-a { background: #8b5cf6; }
        
        .explanation {
            background: #fff3cd;
            padding: 1.5rem;
            border-radius: 8px;
            border-left: 4px solid #ffc107;
        }
        .explanation-title {
            font-weight: bold;
            color: #856404;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }
        .explanation-text {
            color: #856404;
            line-height: 1.6;
        }
        
        .error {
            color: #d32f2f;
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧮 Calculadora de Frequência Alélica</h1>
        <p class="subtitle">Veja como calculamos a frequência dos alelos em uma população</p>
        
        <!-- Input Section -->
        <div class="input-section">
            <div class="input-grid">
                <div class="input-group">
                    <label>
                        <div class="input-with-icon">
                            <span class="genotype-badge">AA</span>
                            Puro dominante
                        </div>
                    </label>
                    <input type="number" id="countAA" min="0" value="20" onchange="validateInputs()">
                    <div class="error" id="errorAA"></div>
                </div>
                
                <div class="input-group">
                    <label>
                        <div class="input-with-icon">
                            <span class="genotype-badge">Aa</span>
                            Heterozigoto
                        </div>
                    </label>
                    <input type="number" id="countAa" min="0" value="50" onchange="validateInputs()">
                    <div class="error" id="errorAa"></div>
                </div>
                
                <div class="input-group">
                    <label>
                        <div class="input-with-icon">
                            <span class="genotype-badge">aa</span>
                            Puro recessivo
                        </div>
                    </label>
                    <input type="number" id="countaa" min="0" value="30" onchange="validateInputs()">
                    <div class="error" id="erroraa"></div>
                </div>
            </div>
        </div>
        
        <div class="button-group">
            <button class="calc-button" onclick="calculate()">📊 Calcular Frequência</button>
            <button class="reset-button" onclick="reset()">↺ Recomeçar</button>
        </div>
        
        <!-- Results Section -->
        <div class="result-section" id="resultSection">
            <!-- Frequency Display -->
            <div class="frequency-display">
                <div class="freq-card">
                    <div class="freq-label">Frequência do Alelo A</div>
                    <div class="freq-value" id="freqA">0%</div>
                    <div class="freq-bar">
                        <div class="freq-bar-fill" id="barA" style="width: 50%;"></div>
                    </div>
                </div>
                
                <div class="freq-card">
                    <div class="freq-label">Frequência do Alelo a</div>
                    <div class="freq-value" id="freqa">0%</div>
                    <div class="freq-bar">
                        <div class="freq-bar-fill" id="bara" style="width: 50%; background: #8b5cf6;"></div>
                    </div>
                </div>
            </div>
            
            <!-- Table with Calculation -->
            <div class="table-section">
                <table>
                    <thead>
                        <tr>
                            <th>Genótipo</th>
                            <th>Quantidade</th>
                            <th>Alelos A</th>
                            <th>Alelos a</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><strong>AA</strong></td>
                            <td id="tableAA">20</td>
                            <td id="tableAACount">40</td>
                            <td>0</td>
                        </tr>
                        <tr>
                            <td><strong>Aa</strong></td>
                            <td id="tableAa">50</td>
                            <td id="tableAaCountA">50</td>
                            <td id="tableAaCounta">50</td>
                        </tr>
                        <tr>
                            <td><strong>aa</strong></td>
                            <td id="tableaa">30</td>
                            <td>0</td>
                            <td id="tableaaCount">60</td>
                        </tr>
                        <tr style="background: #e8d5f2; font-weight: bold;">
                            <td>TOTAL</td>
                            <td id="tableTotalIndv">100</td>
                            <td id="tableTotalA">90</td>
                            <td id="tableTotala">110</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <!-- Allele Pool Visualization -->
            <div class="visualization">
                <div class="vis-title">Pool gênico (100 alelos sorteados)</div>
                <div class="allele-pool" id="allelePool"></div>
            </div>
            
            <!-- Explanation -->
            <div class="explanation">
                <div class="explanation-title">Como funciona o cálculo?</div>
                <div class="explanation-text" id="explanationText"></div>
            </div>
        </div>
    </div>

    <script>
        function validateInputs() {
            const AA = parseInt(document.getElementById('countAA').value) || 0;
            const Aa = parseInt(document.getElementById('countAa').value) || 0;
            const aa = parseInt(document.getElementById('countaa').value) || 0;
            
            document.getElementById('errorAA').textContent = '';
            document.getElementById('errorAa').textContent = '';
            document.getElementById('erroraa').textContent = '';
            
            if (AA < 0) document.getElementById('errorAA').textContent = 'Deve ser ≥ 0';
            if (Aa < 0) document.getElementById('errorAa').textContent = 'Deve ser ≥ 0';
            if (aa < 0) document.getElementById('erroraa').textContent = 'Deve ser ≥ 0';
            
            const total = AA + Aa + aa;
            if (total === 0) return false;
            return true;
        }

        function calculate() {
            if (!validateInputs()) {
                alert('Digite números válidos (maiores que 0)');
                return;
            }
            
            const AA = parseInt(document.getElementById('countAA').value) || 0;
            const Aa = parseInt(document.getElementById('countAa').value) || 0;
            const aa = parseInt(document.getElementById('countaa').value) || 0;
            
            const total = AA + Aa + aa;
            if (total === 0) {
                alert('A população não pode estar vazia!');
                return;
            }
            
            // Calcular total de alelos
            const totalAleles = total * 2;
            const countA = AA * 2 + Aa;
            const counta = aa * 2 + Aa;
            
            // Frequências
            const freqA = (countA / totalAleles * 100).toFixed(1);
            const freqa = (counta / totalAleles * 100).toFixed(1);
            
            // Atualizar display
            document.getElementById('freqA').textContent = freqA + '%';
            document.getElementById('freqa').textContent = freqa + '%';
            
            document.getElementById('barA').style.width = freqA + '%';
            document.getElementById('bara').style.width = freqa + '%';
            
            // Atualizar tabela
            document.getElementById('tableAA').textContent = AA;
            document.getElementById('tableAa').textContent = Aa;
            document.getElementById('tableaa').textContent = aa;
            document.getElementById('tableAACount').textContent = AA * 2;
            document.getElementById('tableAaCountA').textContent = Aa;
            document.getElementById('tableAaCounta').textContent = Aa;
            document.getElementById('tableaaCount').textContent = aa * 2;
            document.getElementById('tableTotalIndv').textContent = total;
            document.getElementById('tableTotalA').textContent = countA;
            document.getElementById('tableTotala').textContent = counta;
            
            // Renderizar pool gênico
            renderAllelePool(countA, counta);
            
            // Explicação
            const explanation = `
                <strong>Fórmula:</strong><br>
                Frequência de A = (2×${AA} + ${Aa}) / (2×${total}) = ${countA} / ${totalAleles} = <strong>${freqA}%</strong><br>
                Frequência de a = (2×${aa} + ${Aa}) / (2×${total}) = ${counta} / ${totalAleles} = <strong>${freqa}%</strong><br><br>
                <strong>Interpretação:</strong> Em cada 100 alelos desta população, ${freqA} são do tipo A e ${freqa} são do tipo a.
            `;
            document.getElementById('explanationText').innerHTML = explanation;
            
            document.getElementById('resultSection').classList.add('show');
        }

        function renderAllelePool(countA, counta) {
            const pool = document.getElementById('allelePool');
            pool.innerHTML = '';
            
            // Mostrar 100 alelos (ou proporção)
            const scale = 100 / (countA + counta);
            const displayA = Math.round(countA * scale);
            const displaya = Math.round(counta * scale);
            
            for (let i = 0; i < displayA; i++) {
                const allele = document.createElement('div');
                allele.className = 'allele allele-A';
                allele.textContent = 'A';
                pool.appendChild(allele);
            }
            
            for (let i = 0; i < displaya; i++) {
                const allele = document.createElement('div');
                allele.className = 'allele allele-a';
                allele.textContent = 'a';
                pool.appendChild(allele);
            }
        }

        function reset() {
            document.getElementById('countAA').value = 20;
            document.getElementById('countAa').value = 50;
            document.getElementById('countaa').value = 30;
            document.getElementById('resultSection').classList.remove('show');
        }

        // Inicializar com valores padrão
        calculate();
    </script>
</body>
</html>
